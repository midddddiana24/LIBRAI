# Production candidate. Sync this Blueprint only after reviewing paid Render resources
# and entering the API URL and browser origin in the Render dashboard.
services:
  - type: web
    name: librai-api-prod
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    disk:
      name: librai-generated
      mountPath: /opt/render/project/src/generated
      sizeGB: 1
    envVars:
      - key: LIBRAI_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: librai-postgres-prod
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TOKENROUTER_API_KEY
        sync: false

  - type: web
    name: librai-admin-prod
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    routes:
      - type: rewrite
        source: /admin/*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: librai-postgres-prod
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 5
    databaseName: librai
    user: librai
    ipAllowList: []
