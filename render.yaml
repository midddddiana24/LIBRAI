services:
  - type: web
    name: librai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: development
      - key: DATABASE_URL
        value: sqlite:///./librai.db
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TOKENROUTER_API_KEY
        sync: false
      - key: TOKENROUTER_MODEL
        value: z-ai/glm-5.3-free
      - key: CORS_ORIGINS
        value: https://librai-kiosk-zjic.onrender.com,https://localhost

  - type: web
    name: librai-kiosk
    runtime: node
    plan: free
    buildCommand: cd web && npm ci && npm run build
    startCommand: node web/server.mjs
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_BASE_URL
        value: https://librai-api-zjic.onrender.com/api/v1
